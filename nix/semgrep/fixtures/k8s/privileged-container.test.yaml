apiVersion: v1
kind: Pod
metadata:
  name: dangerous
spec:
  containers:
    - name: app
      image: example.local/app:1
      # ruleid: kubernetes-privileged-container
      securityContext:
        privileged: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nested
spec:
  template:
    spec:
      containers:
        - name: app
          image: example.local/app:1
          # ruleid: kubernetes-privileged-container
          securityContext:
            runAsNonRoot: false
            privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: limited
spec:
  containers:
    - name: app
      image: example.local/app:1
      # ok: kubernetes-privileged-container
      securityContext:
        privileged: false
---
name: unrelated
# ok: kubernetes-privileged-container
securityContext:
  privileged: true
