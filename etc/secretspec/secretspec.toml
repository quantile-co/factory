[project]
name = "factory"
revision = "1.0"

# Keep ordinary development and checks credential-free. SecretSpec requires a declaration.
[profiles.default]
SECRETSPEC_DEFAULT_PLACEHOLDER = { description = "Unused optional placeholder; leave unset.", required = false, providers = ["env"] }

[profiles.check]

[profiles.test]
CACHIX_AUTH_TOKEN = { description = "Cachix publication token.", required = true, providers = ["env"] }

# WIF creates the credential file; SecretSpec passes its existing path, not its contents.
[profiles.plan]
TF_VAR_gcp_maintainers = { description = "Terraform value containing Google maintainer emails.", required = true, providers = ["env"] }
CACHIX_AUTH_TOKEN = { description = "Cachix publication token.", required = true, providers = ["env"] }
GCP_TF_STATE_BUCKET = { description = "Existing Terraform state bucket.", required = true, providers = ["env"] }
TF_BACKEND_PREFIX = { description = "Terraform state prefix.", required = true, providers = ["env"] }
GITHUB_TOKEN = { description = "GitHub provider token.", required = true, providers = ["env"] }
REST_API_BEARER = { description = "GitHub REST provider token.", required = true, providers = ["env"] }
TF_VAR_gcp_billing_account = { description = "Google Cloud billing account.", required = true, providers = ["env"] }
TF_VAR_gcp_folder_id = { description = "Google Cloud folder.", required = true, providers = ["env"] }
TF_VAR_gcp_wif_pool = { description = "Workload identity pool.", required = true, providers = ["env"] }
TF_VAR_gh_maintainers = { description = "Terraform value containing GitHub maintainer IDs.", required = true, providers = ["env"] }
GOOGLE_APPLICATION_CREDENTIALS = { description = "Existing ADC credential-file path; optional for other ADC sources.", required = false, providers = ["env"] }

[profiles.apply]
TF_VAR_gcp_maintainers = { description = "Terraform value containing Google maintainer emails.", required = true, providers = ["env"] }
CACHIX_AUTH_TOKEN = { description = "Cachix publication token.", required = true, providers = ["env"] }
GCP_TF_STATE_BUCKET = { description = "Existing Terraform state bucket.", required = true, providers = ["env"] }
TF_BACKEND_PREFIX = { description = "Terraform state prefix.", required = true, providers = ["env"] }
GITHUB_TOKEN = { description = "GitHub provider token.", required = true, providers = ["env"] }
REST_API_BEARER = { description = "GitHub REST provider token.", required = true, providers = ["env"] }
TF_VAR_gcp_billing_account = { description = "Google Cloud billing account.", required = true, providers = ["env"] }
TF_VAR_gcp_folder_id = { description = "Google Cloud folder.", required = true, providers = ["env"] }
TF_VAR_gcp_wif_pool = { description = "Workload identity pool.", required = true, providers = ["env"] }
TF_VAR_gh_maintainers = { description = "Terraform value containing GitHub maintainer IDs.", required = true, providers = ["env"] }
GOOGLE_APPLICATION_CREDENTIALS = { description = "Existing ADC credential-file path; optional for other ADC sources.", required = false, providers = ["env"] }
