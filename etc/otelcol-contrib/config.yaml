# Amp orb VM metrics, readable OS logs, retained lifecycle/process logs and OTLP.
# No root access or extra journal permissions are granted by this configuration.
receivers:
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem: {}
      network: {}
      load: {}
      paging: {}
      processes: {}
      process: {}
  filelog:
    include: [/var/log/syslog, /var/log/messages, /var/log/kern.log, /var/log/*.log]
    include_file_path: true
    start_at: end
    storage: file_storage
  filelog/amp:
    # Only explicit log destinations, never terminal sessions or arbitrary artifacts.
    # Development processes may opt in by writing a .log file under workloads/.
    include:
      - ${env:QUANTILE_OTELCOL_LOG_DIRECTORY}/setup.log
      - ${env:QUANTILE_OTELCOL_LOG_DIRECTORY}/resume.log
      - ${env:QUANTILE_OTELCOL_LOG_DIRECTORY}/herdr.log
      - ${env:QUANTILE_OTELCOL_LOG_DIRECTORY}/workloads/*.log
    include_file_path: true
    start_at: beginning
    storage: file_storage
    retry_on_failure:
      enabled: true
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

extensions:
  bearertokenauth:
    filename: ${env:QUANTILE_OTELCOL_TOKEN_FILE}
  file_storage:
    directory: ${env:QUANTILE_OTELCOL_CURSOR_DIRECTORY}

processors:
  resourcedetection/workload:
    detectors: [env]
    override: false
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/metadata:
    error_mode: ignore
    log_statements: &metadata
      - context: resource
        statements:
          - set(resource.cache["entry"], {})
          - 'set(resource.cache["entry"][String(UnixMilli(Now()))], {"AMP_ORB": "${env:AMP_ORB:-}"})'
          - set(resource.cache["prior"], resource.attributes["quantile.metadata"])
          - set(resource.cache["prefix"], "[") where resource.cache["prior"] == nil or (IsList(ParseJSON(resource.cache["prior"])) and Len(ParseJSON(resource.cache["prior"])) == 0)
          - set(resource.cache["prefix"], resource.cache["prior"]) where IsList(ParseJSON(resource.cache["prior"])) and Len(ParseJSON(resource.cache["prior"])) > 0
          - 'replace_pattern(resource.cache["prefix"], "\\]\\s*$$", ",") where resource.cache["prefix"] != nil'
          - set(resource.attributes["quantile.metadata"], Concat([resource.cache["prefix"], String(resource.cache["entry"]), "]"], "")) where resource.cache["prefix"] != nil
    metric_statements: *metadata
    trace_statements: *metadata
  batch:
    timeout: 5s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp_http:
    endpoint: ${env:QUANTILE_OTLP_ENDPOINT}/amp
    auth:
      authenticator: bearertokenauth
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 256

service:
  extensions: [file_storage, bearertokenauth]
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [host_metrics, otlp]
      processors: [memory_limiter, resourcedetection/workload, transform/metadata, batch]
      exporters: [otlp_http]
    logs:
      receivers: [filelog, filelog/amp, otlp]
      processors: [memory_limiter, resourcedetection/workload, transform/metadata, batch]
      exporters: [otlp_http]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/workload, transform/metadata, batch]
      exporters: [otlp_http]
