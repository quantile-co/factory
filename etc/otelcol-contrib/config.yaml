# Amp orb VM metrics, readable OS log files and explicitly routed application OTLP.
# No root access or extra journal permissions are granted by this configuration.
receivers:
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem: {}
      network: {}
      load: {}
      paging: {}
      processes: {}
      process: {}
  filelog:
    include: [/var/log/syslog, /var/log/messages, /var/log/kern.log, /var/log/*.log]
    include_file_path: true
    start_at: end
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  resource:
    attributes:
      - key: service.name
        value: factory-host
        action: insert
      - key: service.instance.id
        value: "${env:OTEL_AGENT_INSTANCE_ID}"
        action: insert
      - key: factory.platform
        value: "${env:OTEL_AGENT_PLATFORM}"
        action: upsert
      - key: vcs.repository.name
        value: "${env:OTEL_AGENT_REPOSITORY}"
        action: upsert
      - key: amp.thread.id
        value: "${env:OTEL_AGENT_THREAD_ID}"
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp_http:
    endpoint: ${env:CLICKSTACK_OTLP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:CLICKSTACK_API_KEY}
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 256

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [host_metrics, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http]
    logs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http]
