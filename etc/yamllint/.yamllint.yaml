extends: default

ignore:
  - "**/.git/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "*.min.yaml"
  - "*.min.yml"
  # Keep upstream rule metadata and Vale styles unchanged.
  - ".semgrep/packs/**"
  - "etc/vale/styles/Google/**"

rules:
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values: ["true", "false", "on", "off"]
