name: Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-production
  cancel-in-progress: false

jobs:
  production:
    name: Infrastructure
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor) &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.triggering_actor)
    runs-on: namespace-profile-quantile-4x8
    environment: prod
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      TF_BACKEND_PREFIX: repository/prod
      TF_VAR_gcp_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
      TF_VAR_gcp_folder_id: ${{ vars.GCP_FOLDER_ID }}
      TF_VAR_gcp_maintainers: ${{ vars.GCP_MAINTAINERS }}
      TF_VAR_gcp_wif_pool: ${{ vars.GCP_WIF_POOL }}
      TF_VAR_gh_maintainers: ${{ vars.GH_MAINTAINERS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          extra_nix_config: require-sigs = true

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ github.repository_owner }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Plan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          REST_API_BEARER: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          direnv="$(nix build --no-link --print-out-paths '.#direnv')/bin/direnv"
          "$direnv" allow .
          "$direnv" exec . ./scripts/github/plan.sh
