name: Check

on:
  pull_request:
  push:
    # Dependabot branches are checked by their pull requests, not twice.
    branches-ignore: [main, "dependabot/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    name: All
    if: github.ref != 'refs/heads/main'
    runs-on: namespace-profile-quantile-4x8
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Full-history Gitleaks rejects shallow checkouts.

      - name: Mount the Nix and Turbo caches
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            /nix
            .turbo/cache
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_options: --no-daemon
          extra_nix_config: require-sigs = true

      - name: Run checks
        env:
          TURBO_TOKEN: >-
            ${{ (github.event_name != 'pull_request' ||
              (github.event.pull_request.head.repo.full_name == github.repository &&
                contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.pull_request.author_association))) &&
              secrets.TURBO_TOKEN || '' }}
        run: |
          export TURBO_CACHE=local:rw
          if [ -n "$TURBO_TOKEN" ]; then
            export TURBO_CACHE=local:rw,remote:r
          fi
          direnv="$(nix build --no-link --print-out-paths '.#direnv')/bin/direnv"
          "$direnv" allow .
          "$direnv" exec . pnpm install --frozen-lockfile
          "$direnv" exec . pnpm run check
