name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    name: All
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: namespace-profile-quantile-4x8
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_options: --no-daemon
          extra_nix_config: require-sigs = true

      - name: Build
        run: |
          direnv="$(nix build --no-link --print-out-paths '.#direnv')/bin/direnv"
          "$direnv" allow .
          "$direnv" exec . ./scripts/github/build.sh
