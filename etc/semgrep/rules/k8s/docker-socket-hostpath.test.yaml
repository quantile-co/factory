apiVersion: v1
kind: Pod
metadata:
  name: dangerous
spec:
  volumes:
    - name: docker
      # ruleid: kubernetes-docker-socket-hostpath
      hostPath:
        path: /var/run/docker.sock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nested
spec:
  template:
    spec:
      volumes:
        - name: docker
          # ruleid: kubernetes-docker-socket-hostpath
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Pod
metadata:
  name: limited
spec:
  volumes:
    - name: shared
      # ok: kubernetes-docker-socket-hostpath
      hostPath:
        path: /mnt/shared
