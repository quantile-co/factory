rules:
  - id: terraform-sensitive-input-must-be-ephemeral
    languages: [terraform]
    paths:
      include: ["*.tf", "*.tofu"]
    severity: ERROR
    message: Sensitive input variables must also declare ephemeral = true.
    patterns:
      - pattern: |
          variable $NAME {
            ...
            sensitive = true
            ...
          }
      - pattern-not: |
          variable $NAME {
            ...
            ephemeral = true
            ...
          }
