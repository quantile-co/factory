# This is a reusable template, not an installed Git hook. Optional checks start
# at the manual stage; consumers can use quantile.git.hooks.withPrePush to
# generate a copy with selected checks enabled. Install pre-push separately.
# Fix hooks remain manual. Kubeconform needs local schemas; OPA hooks need
# consumer policy/namespace args (Conftest also needs workload pathspecs).
# Prettier needs a selected CLI and consumer-owned file pathspecs.
default_stages: [pre-push]
repos:
  - repo: local
    hooks:
      - id: check-added-large-files
        name: Check large source files
        entry: check-added-large-files
        language: system
        types: [file]
        args: [--maxkb=1200, --enforce-all]
      - id: check-case-conflicts
        name: Check case-conflicting paths
        entry: check-case-conflict
        language: system
      - id: check-merge-conflicts
        name: Check merge conflict markers
        entry: check-merge-conflict
        language: system
        args: [--assume-in-merge]
      - id: check-symlinks
        name: Check broken symlinks
        entry: check-symlinks
        language: system
        types: [symlink]
      - id: destroyed-symlinks
        name: Check destroyed symlinks
        entry: destroyed-symlinks
        language: system
        types: [file]
      - id: check-vcs-permalinks
        name: Check GitHub permalinks
        entry: quantile-check-permalinks
        language: system
        args:
          - >-
            github\.com/[^/[:space:]<>"'`]+/[^/[:space:]<>"'`]+/(blob|tree)/[^/[:space:]?#<>"'`()]+
        exclude: ^\.gitignore$
      - id: gitleaks
        name: Full-history and working-tree secret scanning
        entry: quantile-git-gitleaks
        language: system
        pass_filenames: false
        always_run: true
      - id: check-json
        name: Check strict JSON
        entry: check-json
        language: system
        stages: [pre-push]
        types: [json]
        exclude: 'tsconfig\.json$'
      - id: kubeconform
        name: Kubernetes manifest validation
        entry: check-k8s
        language: system
        stages: [manual]
        types: [text]
        files: '^k8s/.*\.(ya?ml|json)$'
        # args: [-schema-location, LOCAL_SCHEMA_TEMPLATE]
      - id: keep-sorted
        name: Check annotated blocks are sorted
        entry: keep-sorted --mode lint
        language: system
        stages: [manual]
        types: [text]
        exclude: &keep-sorted-excludes '^$'
      - id: keep-sorted-fix
        name: Sort annotated blocks explicitly
        entry: keep-sorted --mode fix
        language: system
        stages: [manual]
        types: [text]
        exclude: *keep-sorted-excludes
      - id: markdown
        name: Markdown linting
        entry: check-markdown
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: nixfmt
        name: Check Nix formatting
        entry: check-nixfmt
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: deadnix
        name: Check unused Nix bindings
        entry: check-deadnix
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: statix
        name: Check Nix static analysis
        entry: check-statix
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: nixfmt-fix
        name: Format tracked Nix source explicitly
        entry: fix-nixfmt
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: conftest
        name: Check policy against selected workloads
        entry: check-opa
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: opa-tests
        name: Run policy unit tests
        entry: test-opa
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: prettier
        name: Check selected Prettier formats
        entry: check-prettier
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: prettier-fix
        name: Format selected tracked files explicitly
        entry: fix-prettier
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: commitizen
        name: Conventional Commits
        entry: cz --config .cz.toml check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
