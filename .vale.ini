StylesPath = .vale
MinAlertLevel = suggestion
Vocab = Quantile
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[*.{md,txt,rst,adoc}]
BasedOnStyles = Google, Quantile, Vale
# Vale.Avoid reads the native reject vocabulary; Google retains the spelling policy.
Vale.Avoid = error
Vale.Spelling = NO
Google.WordList = NO
Google.Acronyms = error
Google.Anthropomorphism = error
Google.Colons = error
Google.Contractions = error
Google.Ellipses = error
Google.ExcessiveClaims = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = error
Google.Jargon = error
Google.OxfordComma = error
Google.Parens = error
Google.Passive = error
Google.Ranges = error
Google.Semicolons = error
Google.Spelling = error
Google.Timeless = error
Google.We = error
Google.Will = error
Google.WordListCase = error
