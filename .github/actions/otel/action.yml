name: OpenTelemetry Collector
description: Run the pinned upstream Collector until post-job cleanup, without Nix or Docker.
inputs:
  config:
    description: Optional native Collector YAML path. Must expose health_check on 127.0.0.1:13133.
    required: false
  job-log-prefix:
    description: >-
      Opt-in, unqualified console capture with the built-in config only. Absolute
      runner _diag/pages/<timeline UUID>_<job record UUID>_ prefix, or literal auto
      to discover it from the injected runtime token and native Worker ancestry.
      Unset disables capture. NOT GITHUB_JOB or a step record. Post emits bounded
      padding, checks its visibility in the selected stream and allows drain time
      before stopping. Tail delivery remains best-effort; later Runner housekeeping
      and pages deleted before discovery are not covered. Requires live qualification.
    required: false
outputs:
  log-file:
    description: Private Collector diagnostics under RUNNER_TEMP; never replayed or ingested.
runs:
  using: node24
  main: index.ts
  post: index.ts
  post-if: always()
