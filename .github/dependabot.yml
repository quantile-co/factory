version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: opentofu
    directory: /tf
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    # Best effort only: Check requires the CLI/module revisions and devenv.lock to agree.
    groups:
      devenv:
        patterns:
          - devenv
          - devenv-cli
    commit-message:
      prefix: "chore(deps)"
