name: GitHub Code Quality

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  code-quality: read
  issues: write

concurrency:
  group: github-code-quality
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_options: --no-daemon
          extra_nix_config: require-sigs = true

      - name: Build the pinned CLI
        run: nix build .#github-code-quality --out-link "$RUNNER_TEMP/github-code-quality"

      - name: Sync the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/github-code-quality/bin/github-code-quality"
