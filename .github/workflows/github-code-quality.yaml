name: GitHub Code Quality

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  code-quality: read
  issues: write

concurrency:
  group: github-code-quality
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: namespace-profile-factory-4x8;tailscale.spec=quantile
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          install_options: --no-daemon
          extra_nix_config: require-sigs = true

      - name: Build the pinned CLI
        run: nix build .#github-code-quality --out-link "$RUNNER_TEMP/github-code-quality"

      - name: Sync the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/github-code-quality/bin/github-code-quality"
