name: Test

# TODO: Run continuously in batches, testing the main commits and merges that
# accumulated during the previous run. After a green run, start the next batch.
# On failure, automatically bisect to prepare a revert commit and/or run agents to
# attempt a fix-forward. Request human intervention if neither approach succeeds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    name: All
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: namespace-profile-quantile-4x8
    environment: prod
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Tests run the full-history checks first.

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Read Collector ingestion token
        id: otel-token
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: token:${{ vars.QUANTILE_OTLP_INGEST_SECRET }}
          export_to_environment: false

      - name: Start OpenTelemetry Collector
        uses: quantile-co/factory/.github/actions/otel@96b659232f4b92620433d21a6eb06f9209e5a487
        env:
          QUANTILE_OTLP_ENDPOINT: ${{ vars.QUANTILE_OTLP_ENDPOINT }}
          QUANTILE_OTLP_INGEST_TOKEN: ${{ steps.otel-token.outputs.token }}

      - name: Mount the Nix and Turbo caches
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            /nix
            .turbo/cache
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true
            build-dir = ${{ runner.temp }}

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ github.repository_owner }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Run checks, then tests
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          export TURBO_CACHE=local:rw
          if [ -n "$TURBO_TOKEN" ]; then
            export TURBO_CACHE=local:rw,remote:rw
          fi
          direnv="$(nix build --no-link --print-out-paths '.#direnv')/bin/direnv"
          "$direnv" allow .
          "$direnv" exec . pnpm install --frozen-lockfile
          "$direnv" exec . pnpm run github:test
