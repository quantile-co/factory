name: Apply

on:
  workflow_dispatch:
    inputs:
      tf_layer:
        description: Layer
        required: true
        type: choice
        default: infrastructure
        options:
          - infrastructure
      gh_plan_ref:
        description: Plan ref
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-production
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Infrastructure
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.tf_layer == 'infrastructure'
    runs-on: namespace-profile-quantile-4x8
    environment: prod
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true
            build-dir = ${{ runner.temp }}

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ github.repository_owner }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Apply
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          HINDSIGHT_API_TOKEN: ${{ secrets.HINDSIGHT_API_TOKEN }}
          GH_PLAN_REF: ${{ inputs.gh_plan_ref }} # Prevent shell injection from operator-controlled input.
        run: |
          export -n HINDSIGHT_API_TOKEN
          direnv="$(nix build --no-link --print-out-paths '.#direnv')/bin/direnv"
          "$direnv" allow .
          "$direnv" exec . pnpm install --frozen-lockfile
          shell=$(env -u NIX_CACHE_PRIVATE_KEY "$direnv" export bash)
          eval "$shell"
          unset shell
          export HINDSIGHT_API_TOKEN
          pnpm run github:apply \
            --tf-layer infrastructure \
            --gcp-tf-state-bucket '${{ vars.GCP_TF_STATE_BUCKET }}' \
            --gcp-wif-pool '${{ vars.GCP_WIF_POOL }}' \
            --gh-plan-ref "$GH_PLAN_REF"
