name: Qualify runner collector
on:
  push:
    branches: [qualify/runner-local-collector]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: namespace-profile-factory-4x8;tailscale.spec=quantile
    timeout-minutes: 5
    steps:
      - name: Start runner collector
        run: /opt/factory-github/bin/job-started.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trace a repository integrity check
        shell: bash
        run: |
          cd "$(mktemp -d)"
          npm install --ignore-scripts --no-audit --no-fund @quantile-co/factory-otel@0.5.0 @quantile-co/factory-github@0.2.0
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { withWorkflowTrace } from '@quantile-co/factory-github';
          import { withSpan } from '@quantile-co/factory-otel';
          await withWorkflowTrace('factory.qualification', () => withSpan('repository.fsck', async () => {
            execFileSync('git', ['fsck', '--connectivity-only'], {cwd: process.env.GITHUB_WORKSPACE});
          }));
          JS
      - name: Check collector delivery
        shell: bash
        run: |
          host=${QUANTILE_OTLP_ENDPOINT#https://}
          if getent ahosts "$host" >/dev/null; then echo 'Collector upstream DNS: resolved'; else echo 'Collector upstream DNS: unresolved'; fi
          curl -fsS --max-time 3 http://127.0.0.1:8888/metrics | awk '/^otelcol_(receiver_accepted_spans|exporter_sent_spans)(_total)?[{ ]/ {print $1 ~ /receiver/ ? "Accepted spans:" : "Exported spans:", $NF}'
          log="$RUNNER_TEMP/factory-otel/collector.log"
          if grep -Eiq 'no such host|temporary failure in name resolution' "$log"; then echo 'Collector log: DNS failure'; fi
          if grep -Eiq '401 Unauthorized|403 Forbidden|status code (401|403)' "$log"; then echo 'Collector log: authorization failure'; fi
