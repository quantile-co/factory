name: Cold cache benchmark (temporary)

# Diagnostic branch only. Never merge this workflow replacement into main.
# Reuse the existing dispatchable workflow path; every trial checks out the
# same production source, not these temporary benchmark workflow files.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-cold-cache-benchmark
  cancel-in-progress: false

# Explicit dependencies guarantee serial execution and stop after any failure.
# Thirty pairs alternate A/B: 30 upstream-cache and 30 baseline trials.
jobs:
  a01:
    if: github.ref == 'refs/heads/bench/cold-cache-comparison'
    uses: ./.github/workflows/cold-trial.yaml
    with: { variant: upstream, trial: 1 }
  b01: { needs: a01, uses: ./.github/workflows/cold-trial.yaml, with: { variant: baseline, trial: 1 } }
  a02: { needs: b01, uses: ./.github/workflows/cold-trial.yaml, with: { variant: upstream, trial: 2 } }
