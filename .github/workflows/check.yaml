name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    name: All
    if: github.ref != 'refs/heads/main'
    runs-on: namespace-profile-quantile-8x16
    # About 10m covered observed local rebuilds from completely empty Nix stores.
    # Most checks should reuse the main-populated Namespace persistent cache.
    # Empty stores or Nix changes can lower cache hits and require large downloads.
    # Variable Namespace, Cachix or cache.nixos.org network throughput can push
    # low-hit runs beyond this budget, causing flaky timeouts. A timeout alone
    # does not identify the cause.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true
            extra-substituters = https://devenv.cachix.org https://quantile-co.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= quantile-co.cachix.org-1:OM+kQzUqP3Ija8QQMUxvQNs97u6PB5/s83ZJe7c9WIQ=

      - name: Run checks
        run: nix run path:.#devenv-cli -- tasks run check:all
