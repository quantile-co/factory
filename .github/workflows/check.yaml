name: Check

on:
  pull_request:
  push:
    # Dependabot branches are checked by their pull requests, not twice.
    branches-ignore: ["dependabot/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_store_dir: /home/runner/.cache/pnpm-store
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=${{ github.repository_owner }},service.name=${{ github.event.repository.name }}

jobs:
  all:
    name: All
    # A successful main check also populates the profile’s main-only cache volume.
    runs-on: namespace-profile-factory-4x8;tailscale.spec=quantile
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Full-history Gitleaks rejects shallow checkouts.

      - name: Mount workflow caches
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            /nix
            /home/runner/.cache/pnpm-store
            .turbo/cache
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true
            build-dir = ${{ runner.temp }}

      - name: Run checks
        env:
          TURBO_TOKEN: >-
            ${{ (github.event_name != 'pull_request' ||
              (github.event.pull_request.head.repo.full_name == github.repository &&
                contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.pull_request.author_association))) &&
              secrets.TURBO_TOKEN || '' }}
        run: |
          export TURBO_CACHE=local:rw
          if [ -n "$TURBO_TOKEN" ]; then
            export TURBO_CACHE=local:rw,remote:r
          fi
          direnv="$(nix build --no-link --print-out-paths '.#direnv')/bin/direnv"
          "$direnv" allow .
          "$direnv" exec . pnpm install --frozen-lockfile
          "$direnv" exec . pnpm run check
