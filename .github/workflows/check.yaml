name: Check

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    name: All
    runs-on: namespace-profile-quantile
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true

      - name: Check shared flake
        run: nix flake check path:.

      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          nix shell --inputs-from path:. nixpkgs#semgrep --command bash -euo pipefail -c '
            semgrep --test .semgrep --metrics off
            git ls-files --cached --others --exclude-standard -z -- \
              "*.tf" "*.tofu" "*.tf.json" "*.tofu.json" ":(exclude).semgrep/**" | \
              xargs -0 -r semgrep scan --config .semgrep --metrics off --error --strict --scan-unknown-extensions --quiet
          '

      - name: Check Terraform formatting
        run: nix shell --inputs-from path:. nixpkgs#opentofu --command tofu -chdir=tf fmt -check -recursive

      - name: Validate Terraform without a backend or credentials
        run: |
          nix shell --inputs-from path:. nixpkgs#opentofu --command tofu -chdir=tf init -backend=false -input=false -lockfile=readonly
          nix shell --inputs-from path:. nixpkgs#opentofu --command tofu -chdir=tf validate -no-color
