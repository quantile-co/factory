# Runner-visible process, mount and network metrics, not physical-host telemetry.
# CPU/memory/disk are per-process: host_metrics' system CPU/memory counters are
# not cgroup-aware. Container aggregate accounting remains a separate capability.
receivers:
  host_metrics:
    collection_interval: 30s
    scrapers:
      process: {}
      filesystem: {}
      network: {}

  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
processors:
  resourcedetection/workload:
    detectors: [env]
    override: false
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/metadata:
    error_mode: ignore
    log_statements: &metadata
      - context: resource
        statements:
          - set(resource.cache["entry"], {})
          - set(resource.cache["entry"][String(UnixMilli(Now()))], ParseJSON(Decode("${env:QUANTILE_OTELCOL_METADATA:-e30=}", "base64")))
          - set(resource.cache["prior"], resource.attributes["quantile.metadata"])
          - set(resource.cache["prefix"], "[") where resource.cache["prior"] == nil or (IsList(ParseJSON(resource.cache["prior"])) and Len(ParseJSON(resource.cache["prior"])) == 0)
          - set(resource.cache["prefix"], resource.cache["prior"]) where IsList(ParseJSON(resource.cache["prior"])) and Len(ParseJSON(resource.cache["prior"])) > 0
          - 'replace_pattern(resource.cache["prefix"], "\\]\\s*$$", ",") where resource.cache["prefix"] != nil'
          - set(resource.attributes["quantile.metadata"], Concat([resource.cache["prefix"], String(resource.cache["entry"]), "]"], "")) where resource.cache["prefix"] != nil
    metric_statements: *metadata
    trace_statements: *metadata
  batch:
    timeout: 1s
exporters:
  otlp_http:
    endpoint: ${env:QUANTILE_OTLP_ENDPOINT}/otel
    timeout: 10s
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 256
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [host_metrics, otlp]
      processors: [memory_limiter, resourcedetection/workload, transform/metadata, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/workload, transform/metadata, batch]
      exporters: [otlp_http]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/workload, transform/metadata, batch]
      exporters: [otlp_http]
