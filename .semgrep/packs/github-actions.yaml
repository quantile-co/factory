            - pattern-not: ${{ ... github.event.project.name && ... }}
            - pattern-not: ${{ ... github.event.project_column.name && ... }}
            - pattern-not: ${{ ... github.event.release.name && ... }}
            - pattern-not: ${{ ... github.event.release.body && ... }}
            - pattern-not: ${{ ... github.event.deployment.ref && ... }}
    severity: ERROR
  - id: yaml.github-actions.security.secrets-inherit.secrets-inherit
    languages:
      - yaml
    severity: ERROR
    message: 'This workflow uses `secrets: inherit` to pass all of the calling workflow''s secrets to a reusable workflow. This violates the principle of least privilege because the called workflow receives access to every secret in the repository, not just the ones it needs. If the called workflow is compromised or sourced from a third party, an attacker gains access to all repository secrets. Instead, explicitly pass only the secrets that the called workflow requires using the `secrets:` map, e.g. `secrets: { MY_SECRET: ${{ secrets.MY_SECRET }} }`.'
    metadata:
      category: security
      cwe:
        - 'CWE-250: Execution with Unnecessary Privileges'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - https://docs.github.com/en/actions/sharing-automations/reusing-workflows#passing-inputs-and-secrets-to-a-reusable-workflow
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
      technology:
        - github-actions
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      confidence: HIGH
    patterns:
      - pattern-inside: |
          jobs:
            ...
      - pattern: 'secrets: inherit'
  - id: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
    languages:
      - yaml
    message: This GitHub Actions workflow file uses `workflow_run` and checks out code from the incoming pull request. When using `workflow_run`, the Action runs in the context of the target repository, which includes access to all repository secrets. Normally, this is safe because the Action only runs code from the target repository, not the incoming PR. However, by checking out the incoming PR code, you're now using the incoming code for the rest of the action. You may be inadvertently executing arbitrary code from the incoming PR with access to repository secrets, which would let an attacker steal repository secrets. This normally happens by running build scripts (e.g., `npm build` and `make`) or dependency installation scripts (e.g., `python setup.py install`). Audit your workflow file to make sure no code from the incoming PR is executed. Please see https://securitylab.github.com/research/github-actions-preventing-pwn-requests/ for additional mitigations.
    metadata:
      category: security
      owasp: A01:2017 - Injection
      cwe: 'CWE-913: Improper Control of Dynamically-Managed Code Resources'
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      subcategory:
        - vuln
      references:
        - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
        - https://github.com/justinsteven/advisories/blob/master/2021_github_actions_checkspelling_token_leak_via_advice_symlink.md
        - https://www.legitsecurity.com/blog/github-privilege-escalation-vulnerability
      technology:
        - github-actions
    patterns:
      - pattern-inside: |
          on:
            ...
            workflow_run: ...
            ...
          ...
      - pattern-inside: |
          jobs:
            ...
            $JOBNAME:
              ...
              steps:
                ...
      - pattern: |
          ...
          uses: "$ACTION"
          with:
            ...
            ref: $EXPR
      - metavariable-regex:
          metavariable: $ACTION
          regex: actions/checkout@.*
      - metavariable-pattern:
          language: generic
          metavariable: $EXPR
          patterns:
            - pattern: ${{ github.event.workflow_run ... }}
    severity: WARNING
