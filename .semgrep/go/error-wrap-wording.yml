rules:
  - id: go-error-wrap-wording
    languages: [go]
    severity: ERROR
    message: >-
      Use a concrete verb instead of leading with "failed", "unable",
      "could", "error" or "cannot" when adding error context.
    paths:
      include: ["*.go"]
      exclude:
        - "**/mocks/**"
        - "**/*_templ.go"
        - "**/*_gen.go"
        - "**/*.pb.go"
        - "**/*.sql.go"
    patterns:
      - pattern: fmt.Errorf($FORMAT, ...)
      - metavariable-regex:
          metavariable: $FORMAT
          regex: '^"(?i:(?:failed|fail|unable|could|error|cannot|can not))\b'
